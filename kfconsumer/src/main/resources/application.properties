spring.application.name=kfconsumer

server.port=8082

spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=order-consumer-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.rk.kfproduce.model,com.rk.kfproduce.model.*
spring.kafka.consumer.properties.spring.json.value.default.type=com.rk.kfproduce.model.Order
